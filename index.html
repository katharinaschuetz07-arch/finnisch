<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finnisch Lernen v2.9.7</title>
    <style>
        :root { 
            --fi-blue: #003580; 
            --fi-white: #FFFFFF;
            --fi-dark-bg: #001a3d;
            --btn-height: 38px; 
        }
        body {
            background: #000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; font-family: 'Segoe UI', Arial, sans-serif;
        }
        .app-container {
            width: 320px; margin-top: 18px; 
            background: radial-gradient(circle at center, var(--fi-dark-bg) 0%, #000 100%);
            border: 4px solid var(--fi-blue); border-radius: 60px; overflow: hidden;
            display: flex; flex-direction: column; padding-top: 15px; padding-bottom: 25px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.9);
        }
        header { text-align: center; position: relative; padding-bottom: 5px; }
        .flag-icon { font-size: 1.4em; position: absolute; top: 12px; }
        .flag-l { left: 30px; } .flag-r { right: 30px; }
        header h1 { color: var(--fi-white); margin: 0; font-size: 1.6em; text-transform: uppercase; letter-spacing: 2px; }
        .sub-header { color: var(--fi-blue); font-size: 0.8em; text-transform: uppercase; font-weight: bold; background: white; display: inline-block; padding: 2px 10px; border-radius: 5px; margin-top: 5px; }
        .version-info { color: var(--fi-white); font-size: 0.65em; opacity: 0.5; margin-top: 5px; }
        .divider { width: 65%; height: 2px; background: linear-gradient(90deg, var(--fi-blue), var(--fi-white), var(--fi-blue)); margin: 10px auto; }

        .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 0 15px 15px 15px; }
        .premium-btn {
            background: rgba(255,255,255,0.05); color: var(--fi-white); border: 1px solid var(--fi-blue);
            height: var(--btn-height); font-size: 0.62em; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase;
        }
        .premium-btn:active { background: var(--fi-blue); }

        .flashcard {
            width: 280px; height: 160px; background: linear-gradient(145deg, #111, #001a3d);
            border: 2px solid var(--fi-white); border-radius: 35px; margin: 10px auto;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; cursor: pointer; position: relative;
        }
        .category-label { position: absolute; top: 12px; left: 20px; color: var(--fi-blue); font-size: 0.55em; font-weight: bold; text-transform: uppercase; background: white; padding: 1px 5px; border-radius: 3px;}
        #phrase-fi { font-size: 1.25em; color: var(--fi-white); font-weight: bold; margin-bottom: 2px; padding: 0 10px; }
        #phrase-phonetic { font-size: 0.75em; color: #a0c4ff; font-style: italic; margin-bottom: 6px; }
        #phrase-de { font-size: 0.85em; color: #fff; opacity: 0.6; }
        .card-counter-inside { position: absolute; bottom: 12px; right: 25px; color: var(--fi-white); font-size: 0.65em; }

        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 5px 35px; }
        .ctrl-btn { background: #000; color: var(--fi-white); border: 1px solid var(--fi-blue); height: var(--btn-height); border-radius: 15px; font-weight: bold; cursor: pointer; font-size: 0.65em; text-transform: uppercase; }
        .play-btn { background: var(--fi-blue); color: #fff; border: none; }
        
        .menu-footer { width: 180px; margin: 25px auto 5px auto; background: var(--fi-white); color: var(--fi-blue); height: 38px; display: flex; justify-content: center; align-items: center; font-weight: 900; border-radius: 20px; cursor: pointer; text-transform: uppercase; font-size: 0.8em; }
        .outer-footer { margin: 15px 0 30px 0; color: var(--fi-blue); font-size: 0.75em; font-weight: bold; }
    </style>
</head>

        <button class="premium-btn" onclick="setCategory('fragen')">Fragen</button>

        <button class="premium-btn" onclick="setCategory('idiome')">Redewendung</button>
        <button class="premium-btn" onclick="setCategory('a2')">A2 Level</button> 
        <button class="premium-btn" onclick="setCategory('zahlen')">Zahlen</button>

    <div class="flashcard" onclick="nextCardWithAudio()">

        <div id="phrase-fi">Tervetuloa</div>
        <div id="phrase-phonetic">[ter-ve-tu-lo-a]</div>
        <div id="phrase-de">Willkommen</div>
        <div class="card-counter-inside" id="counter">1 / 1</div>
    </div>

    <div class="controls">
        <button class="ctrl-btn" onclick="prevCard()">Zurück</button>
        <button class="ctrl-btn play-btn" onclick="speak()">Hören</button>
        <button class="ctrl-btn" onclick="nextCardWithAudio()">Vor</button>
    </div>

    <div class="menu-footer" onclick="setCategory('basis')">Start/Reset</div>
</div>

    let currentCategory = 'basis';
    let currentIndex = 0;

    function updateCard() {
        const item = data[currentCategory][currentIndex];
        document.getElementById('phrase-fi').innerText = item.fi;
        document.getElementById('phrase-phonetic').innerText = item.ph;
        document.getElementById('phrase-de').innerText = item.de;
        document.getElementById('cat-label').innerText = currentCategory.toUpperCase();
        document.getElementById('counter').innerText = `${currentIndex + 1} / ${data[currentCategory].length}`;
    }

    function setCategory(cat) {
        currentCategory = cat;
        currentIndex = 0;
        updateCard();
        speak(); // Liest vor, wenn Button geklickt wird
    }

    function nextCardWithAudio() {
        currentIndex = (currentIndex + 1) % data[currentCategory].length;
        updateCard();
        speak(); // Liest vor, wenn Karte geklickt wird
    }

    function prevCard() {
        currentIndex = (currentIndex - 1 + data[currentCategory].length) % data[currentCategory].length;
        updateCard();
        speak();
    }

    function speak() {
        const text = data[currentCategory][currentIndex].fi;
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'fi-FI';
        msg.rate = 0.9;
        window.speechSynthesis.speak(msg);
    }

    updateCard();
